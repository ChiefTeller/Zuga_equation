<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Zuga entrance screen: תופעות, קשרים, מתח, מידע ותנועה אינסופית."
    />
    <title>∞ = Zuga | זוגא</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="zuga-field" aria-hidden="true"></canvas>

    <header class="site-header" aria-label="Zuga">
      <a class="brand" href="#" aria-label="Zuga home">
        <span>∞</span>
        <strong>ZUGA</strong>
      </a>
      <p class="header-line">תורת זוגא</p>
    </header>

    <main class="entrance" aria-labelledby="hero-title">
      <section class="hero-copy">
        <p class="eyebrow">פילוסופיית מבנה הקיום</p>
        <h1 id="hero-title">
          <span>∞</span>
          <span>= Zuga</span>
        </h1>
        <p class="he-line">זוגא הוא האינסוף</p>
        <p class="en-line" lang="en" dir="ltr">Infinity is not still. Infinity moves.</p>
        <p class="summary">
          שתי תופעות. קשרים. מתח. מידע. אפשרויות. תנועה אינסופית ביניהן.
        </p>

        <div class="formula" aria-label="מבנה זוגא">
          <span dir="ltr">Z = (Z1, Z2, R, τ, I, P)</span>
          <span dir="ltr">(∞ ⇄ Zα ⇄ ΔR, Δτ, ΔI ⇄ Zβ ⇄ ∞) ∈ P</span>
        </div>

        <button class="enter-button" id="enter-motion" type="button">
          <span>כניסה</span>
          <span aria-hidden="true">↵</span>
        </button>
      </section>

      <aside class="signal-strip" aria-label="מרכיבי זוגא">
        <span><strong>Zα</strong> תופעה</span>
        <span><strong>R</strong> קשר</span>
        <span><strong>τ</strong> מתח</span>
        <span><strong>I</strong> מידע</span>
        <span><strong>P∞</strong> אפשרויות</span>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
